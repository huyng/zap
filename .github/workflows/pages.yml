name: pages

# Publishes the documentation in docs/ to GitHub Pages. Pages must be set to
# "GitHub Actions" as its source once, in Settings → Pages.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push finish rather than cancelling
# it halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the pages
        run: |
          # Every internal link has to resolve, or the site ships broken.
          cd docs
          for page in *.html; do
            grep -o 'href="[^"]*"' "$page" |
              sed 's/^href="//; s/"$//' |
              grep -v '^https\?://' |
              grep -v '^#' |
              while read -r link; do
                target=${link%%#*}
                [ -z "$target" ] && continue
                if [ ! -e "$target" ]; then
                  echo "::error file=docs/$page::$target does not exist"
                  exit 1
                fi
              done || exit 1
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
